<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة المنتجات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      padding: 20px;
    }

    .product-selection {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .product-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 250px;
      cursor: pointer;
      overflow: hidden;
      text-align: center;
      border: 2px solid transparent;
      transition: border 0.3s, transform 0.3s;
      position: relative;
    }

    .product-card:hover {
      transform: scale(1.03);
    }

    .product-card.selected {
      border: 2px solid #2196f3;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-card h3 {
      padding: 10px;
      margin: 0;
      font-size: 18px;
    }

    .product-radio {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
    }

    .form-wrapper {
      background-color: #fff;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    .form-description {
      text-align: center;
      margin-bottom: 20px;
      color: #555;
    }

    .step {
      display: none;
      flex-direction: column;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .step.show {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #2196f3;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #1976d2;
    }

    .confirmation {
      display: none;
      text-align: center;
      font-size: 18px;
      color: green;
      margin-top: 20px;
    }

    /* WhatsApp Button */
    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
      background-color: #25D366;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: spin 3s linear infinite;
    }

    .whatsapp-button img {
      width: 30px;
      height: 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .product-card {
        width: 100%;
        scale: 1,5;
      }
.product-selection {
  flex-wrap:initial ;
}
 .product-card img {
      width: 100%;
      height:auto;
      object-fit: cover;
    }
      .form-wrapper {
        padding: 20px;
      }
    }
    .form-logo {
  text-align: center;
  margin-bottom: 20px;
}

.form-logo img {
  width: 80px;
  height: auto;
  border-radius: 8px;
}

  </style>
</head>
<body>
<div>
        <h2 style="text-align: center; margin-bottom: 15px;">الرجاء اختيار منتج</h2>
    </div>
  <!-- Sélection des produits -->
  <div class="product-selection">
    
  

    <div class="product-card" onclick="selectProduct(this, 'منتج 1')">
      <input type="radio" name="product" class="product-radio">
<img src="" alt="منتج 1">     
      <h3>منتج 1</h3>
    </div>
    <div class="product-card" onclick="selectProduct(this, 'منتج 2')">
      <input type="radio" name="product" class="product-radio">
<img src="" alt="منتج 1">      
      <h3>منتج 2</h3>
    </div>
    <div class="product-card" onclick="selectProduct(this, 'منتج 3')">
      <input type="radio" name="product" class="product-radio">
<img src="" alt="منتج 1">
      <h3>منتج 3</h3>
    </div>
  </div>

    <h2>نموذج التسجيل</h2>
    <p class="form-description" id="productName">اختر المنتج أولاً</p>

    <form id="multiStepForm">
      <!-- Step 1 (toujours visible) -->
      <div class="step show" id="step-0">
        <input type="text" name="name" placeholder="الاسم الكامل" required />
        <input type="tel" name="phone" placeholder="رقم الهاتف" required />
        <input type="email" name="email" placeholder="البريد الإلكتروني" required />
        <button type="button" onclick="nextStep()">إرسال</button>
      </div>

      <!-- Step 2 -->
      <div class="step" id="step-1">
        <input type="text" placeholder="ما هي مهنتك؟" required />
        <button type="button" onclick="nextStep()">التالي</button>
      </div>

      <!-- Step 3 -->
      <div class="step" id="step-2">
        <select required>
          <option value="">اختر مجال اهتمامك</option>
          <option value="التسويق">التسويق</option>
          <option value="البرمجة">البرمجة</option>
          <option value="التصميم">التصميم</option>
        </select>
        <button type="button" onclick="nextStep()">التالي</button>
      </div>

      <!-- Step 4 -->
      <div class="step" id="step-3">
        <input type="text" placeholder="ما هو هدفك من هذا النموذج؟" required />
        <button type="button" onclick="showConfirmation()">إرسال نهائي</button>
      </div>
    </form>

    <div class="confirmation" id="confirmation">
      ✅ تم إرسال النموذج بنجاح! شكراً لك.
    </div>
  </div>

  <!-- WhatsApp Button -->
  <a href="https://wa.me/21612345678" target="_blank" class="whatsapp-button" aria-label="WhatsApp">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
  </a>

  <script>
    let currentStep = 0;
    const steps = document.querySelectorAll(".step");
    const productName = document.getElementById("productName");

    function selectProduct(card, name) {
      document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      card.querySelector('input[type=radio]').checked = true;
      productName.textContent = "المنتج المختار: " + name;
    }

    function showStep(index) {
      steps.forEach((step) => {
        step.classList.remove("show");
        step.style.display = "none";
      });
      steps[index].style.display = "flex";
      setTimeout(() => {
        steps[index].classList.add("show");
      }, 10);
    }

    function nextStep() {
      steps[currentStep].classList.remove("show");
      setTimeout(() => {
        currentStep++;
        if (currentStep < steps.length) {
          showStep(currentStep);
        }
      }, 300);
    }

    function showConfirmation() {
      document.getElementById("multiStepForm").style.display = "none";
      document.getElementById("confirmation").style.display = "block";
    }
  </script>

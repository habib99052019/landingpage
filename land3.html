<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نموذج الصفحة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: url('https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-wrapper {
  background-color: rgba(255, 255, 255, 0.95);
  padding: 40px 30px;
  border-radius: 16px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  text-align: center;
  position: relative;
  overflow: hidden;
  min-height: auto; /* plus besoin de min-height fixe */
}


    h2 {
      margin-bottom: 10px;
    }

    .form-description {
      color: #555;
      margin-bottom: 30px;
      font-size: 16px;
    }

    
.step {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  position: static; /* 🔁 corrige le problème */
}

   .step.show {
  display: flex;
  opacity: 1;
  transform: translateY(0);
}

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #2196f3;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1976d2;
    }

    .confirmation {
      display: none;
      font-size: 18px;
      color: green;
      margin-top: 40px;
    }

    /* WhatsApp Button */
    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
      background-color: #25D366;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: spin 3s linear infinite;
    }

    .whatsapp-button img {
      width: 30px;
      height: 30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .form-wrapper {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="form-wrapper">
    <h2>نموذج التسجيل</h2>
    <p class="form-description">املأ هذا النموذج لتحصل على استشارتك المجانية خلال دقائق.</p>

    <form id="multiStepForm">
      <!-- Step 1 -->
      <div class="step" id="step-0">
        <input type="text" name="name" placeholder="الاسم الكامل" required />
        <input type="tel" name="phone" placeholder="رقم الهاتف" required />
        <input type="email" name="email" placeholder="البريد الإلكتروني" required />
        <button type="button" onclick="nextStep()">إرسال</button>
      </div>

      <!-- Step 2 -->
      <div class="step" id="step-1">
        <input type="text" placeholder="ما هي مهنتك؟" required />
        <button type="button" onclick="nextStep()">التالي</button>
      </div>

      <!-- Step 3: Dropdown -->
      <div class="step" id="step-2">
        <select required>
          <option value="">اختر مجال اهتمامك</option>
          <option value="التسويق">التسويق</option>
          <option value="البرمجة">البرمجة</option>
          <option value="التصميم">التصميم</option>
          <option value="ريادة الأعمال">ريادة الأعمال</option>
        </select>
        <button type="button" onclick="nextStep()">التالي</button>
      </div>

      <!-- Step 4 -->
      <div class="step" id="step-3">
        <input type="text" placeholder="ما هو هدفك من هذا النموذج؟" required />
        <button type="button" onclick="showConfirmation()">إرسال نهائي</button>
      </div>
    </form>

    <div class="confirmation" id="confirmation">
      ✅ تم إرسال النموذج بنجاح! شكراً لك.
    </div>
  </div>

  <!-- WhatsApp Button -->
  <a href="https://wa.me/21612345678" target="_blank" class="whatsapp-button" aria-label="WhatsApp">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
  </a>

  <script>
    let currentStep = 0;
    const steps = document.querySelectorAll(".step");

    function showStep(index) {
      steps.forEach((step, i) => {
        step.classList.remove("show");
        step.style.display = "none";
      });
      steps[index].style.display = "flex";
      setTimeout(() => {
        steps[index].classList.add("show");
      }, 10);
    }

    function nextStep() {
      steps[currentStep].classList.remove("show");
      setTimeout(() => {
        currentStep++;
        if (currentStep < steps.length) {
          showStep(currentStep);
        }
      }, 300);
    }

    function showConfirmation() {
      document.getElementById("multiStepForm").style.display = "none";
      document.getElementById("confirmation").style.display = "block";
    }

    window.onload = () => {
      showStep(currentStep);
    };
  </script>
</body>
</html>
